services:
  db:
    image: postgres:17
    container_name: warehouseq-db
    environment:
      POSTGRES_USER: warehouseq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warehouseq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouseq -d warehouseq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
